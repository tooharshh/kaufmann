x-runtime: &runtime
  image: kaufmann:${IMAGE_TAG:-production}
  build:
    context: .
    target: runtime
  env_file: .env
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 90s

services:
  api:
    <<: *runtime
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  voice:
    <<: *runtime
    command: [python, -m, src.agent, start]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
